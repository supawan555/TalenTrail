[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    live: calls the real LLM path (Gemini). Deselect in CI with -m "not live".
    variance: repeated-run consistency checks; slow under --live.
    ordering: relative-ranking assertions (more reliable than absolute bands).
    bands: absolute expected-score-band assertions.
    parsing: response-parsing robustness, never touches the network.
